<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Go Ride</title>
    <meta name="theme-color" content="#2563EB">

    <link rel="icon" href="assets/svg/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar" aria-label="Primary navigation">
                <a class="brand" href="index.html">
                    <img src="assets/svg/logo.svg" alt="Go Ride logo">
                    <span>Go Ride</span>
                </a>
                <div class="nav-buttons">
                    <a href="index.html" class="login-btn">Home</a>
                    <a href="booking.html" class="book-btn">Book Ride</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="container" style="min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px 20px;">
        <div style="font-size: 5rem; font-weight: 800; color: var(--color-primary); line-height: 1;">404</div>
        <h1 style="font-size: 1.8rem; margin: 16px 0 8px; color: var(--color-text-primary);">Page Not Found</h1>
        <p style="color: var(--color-text-secondary); max-width: 480px; margin-bottom: 28px;">The route or page you are looking for has taken an unexpected detour or no longer exists.</p>
        <div style="display: flex; gap: 14px; justify-content: center;">
            <a href="index.html" class="primary-btn" style="text-decoration: none;">Return Home</a>
            <a href="booking.html" class="secondary-btn" style="text-decoration: none;">Book a Ride</a>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">© 2026 Go Ride Technologies. All rights reserved.</div>
        </div>
    </footer>

    <script src="js/helpers.js"></script>
</body>
</html>
